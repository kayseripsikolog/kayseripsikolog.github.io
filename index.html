<!DOCTYPE html>
<html lang="tr">
<head>

            --light-bg: #FFFFFF;

        body {

            margin: 0;

            color: var(--text-color);

            font-size: 2.8rem;

        }

            margin-top: 10px; 
            opacity: 0.9;
        }
        .container {

            border-radius: 12px; 
        }
        section { 
            margin-bottom: 45px; 
        }
        section:last-child { 
            margin-bottom: 0; 
        }
        h2 {

            font-size: 1.8rem; 
            margin-bottom: 25px; 
            border-bottom: 2px solid #eaeaea;
            padding-bottom: 10px;
        }
        p {
            margin-bottom: 15px;
        }
